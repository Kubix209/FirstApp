<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja Nauczyciela</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f5f5f5; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 300px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        fieldset { border: 1px solid #ddd; border-radius: 4px; }
        legend { font-weight: bold; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-weight: normal; }
        .btn { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; text-decoration: none; color: #2196F3; font-weight: bold; }
    </style>
</head>
<body>
<div class="nav">
    <a href="/students">📚 Studenci</a>
    <a href="/teachers">👨‍🏫 Nauczyciele</a>
    <a href="/lessons">📅 Lekcje</a>
</div>

<h1>📝 Rejestracja Nauczyciela</h1>

<form th:action="@{/teachers/create}" method="post">
    <div class="form-group">
        <label for="firstName">Imię:</label>
        <input type="text" id="firstName" name="firstName" required>
    </div>

    <div class="form-group">
        <label for="lastName">Nazwisko:</label>
        <input type="text" id="lastName" name="lastName" required>
    </div>

    <fieldset class="form-group">
        <legend>Języki programowania:</legend>

        <label class="checkbox-label" th:each="lang : ${languages}">
            <input type="checkbox" name="languages" th:value="${lang}">
            <span th:text="${lang}"></span>
        </label>
    </fieldset>

    <button type="submit" class="btn">Zapisz</button>
    <a href="/teachers" style="margin-left:10px;">Anuluj</a>
</form>
</body>
</html>
